<!DOCTYPE html>
<html lang="en">

<head>

<link rel="stylesheet" href="assets/css/style.css">

<body>

<div class="login-wrapper">

<div class="login-box">

<h1>Origin Web3 CMS</h1>

<p>Administrator Login</p>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<p id="loginMessage"></p>

</div>

</div>

<script src="assets/js/login.js"></script>
