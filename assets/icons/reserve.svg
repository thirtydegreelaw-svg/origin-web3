<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Red Gradients for the 3D effect -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6666" />
      <stop offset="50%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#660000" />
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="30%" stop-color="#ff3333" />
      <stop offset="70%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#660000" />
    </linearGradient>
    <linearGradient id="pedimentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="100%" stop-color="#4d0000" />
    </linearGradient>
    <!-- Filter for soft shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Roof / Pediment Triangle -->
    <polygon points="200,70 60,150 340,150" fill="url(#roofGrad)" stroke="#4d0000" stroke-width="2" stroke-linejoin="round"/>
    <!-- Roof Bottom Trim -->
    <rect x="60" y="148" width="280" height="18" fill="url(#roofGrad)" stroke="#4d0000" stroke-width="2" />
    <!-- Roof Inner Fill (Dark Red) -->
    <polygon points="200,90 90,142 310,142" fill="url(#pedimentGrad)" />

    <!-- Columns (4 Pillars) -->
    <!-- Pillar 1 -->
    <rect x="95" y="170" width="30" height="140" fill="url(#pillarGrad)" stroke="#4d0000" stroke-width="2" />
    <ellipse cx="110" cy="170" rx="18" ry="8" fill="#cc0000" stroke="#4d0000" stroke-width="2" />
    <ellipse cx="110" cy="310" rx="18" ry="8" fill="#990000" stroke="#4d0000" stroke-width="2" />

    <!-- Pillar 2 -->
    <rect x="185" y="170" width="30" height="140" fill="url(#pillarGrad)" stroke="#4d0000" stroke-width="2" />
    <ellipse cx="200" cy="170" rx="18" ry="8" fill="#cc0000" stroke="#4d0000" stroke-width="2" />
    <ellipse cx="200" cy="310" rx="18" ry="8" fill="#990000" stroke="#4d0000" stroke-width="2" />

    <!-- Pillar 3 -->
    <rect x="185" y="170" width="30" height="140" fill="url(#pillarGrad)" stroke="#4d0000" stroke-width="2" />
    <ellipse cx="200" cy="170" rx="18" ry="8" fill="#cc0000" stroke="#4d0000" stroke-width="2" />
    <ellipse cx="200" cy="310" rx="18" ry="8" fill="#990000" stroke="#4d0000" stroke-width="2" />

    <!-- Pillar 4 -->
    <rect x="275" y="170" width="30" height="140" fill="url(#pillarGrad)" stroke="#4d0000" stroke-width="2" />
    <ellipse cx="290" cy="170" rx="18" ry="8" fill="#cc0000" stroke="#4d0000" stroke-width="2" />
    <ellipse cx="290" cy="310" rx="18" ry="8" fill="#990000" stroke="#4d0000" stroke-width="2" />

    <!-- Base Platform -->
    <rect x="35" y="315" width="330" height="25" fill="url(#baseGrad)" stroke="#4d0000" stroke-width="2" />
    <rect x="25" y="340" width="350" height="25" fill="url(#baseGrad)" stroke="#4d0000" stroke-width="2" />
  </g>
</svg>