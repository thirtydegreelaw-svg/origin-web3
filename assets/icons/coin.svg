<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>

    <!-- main glossy red gradient for the star body -->
    <linearGradient id="starGrad" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%"  stop-color="#ff90a8"/>
      <stop offset="30%" stop-color="#f2003f"/>
      <stop offset="70%" stop-color="#c4002f"/>
      <stop offset="100%" stop-color="#7a0020"/>
    </linearGradient>

    <!-- inner rim shading to fake a rounded metallic edge -->
    <linearGradient id="starEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="82%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".35"/>
    </linearGradient>

    <!-- center sphere -->
    <radialGradient id="sphereGrad" cx="34%" cy="28%" r="75%">
      <stop offset="0%"  stop-color="#ffc2d1"/>
      <stop offset="35%" stop-color="#f2003f"/>
      <stop offset="75%" stop-color="#b8002f"/>
      <stop offset="100%" stop-color="#6e001c"/>
    </radialGradient>

    <!-- ground reflection -->
    <radialGradient id="reflGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#f2003f" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#f2003f" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#f2003f" stop-opacity="0"/>
    </radialGradient>

    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <filter id="softenBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

  </defs>

  <!-- soft ground reflection -->
  <ellipse cx="100" cy="208" rx="72" ry="9" fill="url(#reflGrad)" filter="url(#softenBig)"/>

  <!-- faint ambient sparkle dots, matching the reference image -->
  <g fill="#f2003f" opacity=".18">
    <circle cx="34" cy="60" r="1.6"/>
    <circle cx="168" cy="52" r="1.4"/>
    <circle cx="150" cy="150" r="1.5"/>
    <circle cx="42" cy="150" r="1.3"/>
    <circle cx="100" cy="24" r="1.2"/>
  </g>

  <!-- ============ FOUR-POINT COMPASS STAR ============ -->
  <g>
    <path
      d="M100,12
         C110,15 120,45 124.04,75.96
         C155,80 188,90 188,100
         C188,110 155,120 124.04,124.04
         C120,155 110,185 100,188
         C90,185 80,155 75.96,124.04
         C45,120 12,110 12,100
         C12,90 45,80 75.96,75.96
         C80,45 90,15 100,12
         Z"
      fill="url(#starGrad)"/>

    <path
      d="M100,12
         C110,15 120,45 124.04,75.96
         C155,80 188,90 188,100
         C188,110 155,120 124.04,124.04
         C120,155 110,185 100,188
         C90,185 80,155 75.96,124.04
         C45,120 12,110 12,100
         C12,90 45,80 75.96,75.96
         C80,45 90,15 100,12
         Z"
      fill="url(#starEdge)"/>

    <!-- glossy specular streaks, one per arm -->
    <g fill="#ffffff" filter="url(#soften)">
      <ellipse cx="90" cy="32" rx="4.5" ry="15" opacity=".4" transform="rotate(-18 90 32)"/>
      <ellipse cx="168" cy="90" rx="4.5" ry="15" opacity=".4" transform="rotate(72 168 90)"/>
      <ellipse cx="110" cy="168" rx="4.5" ry="15" opacity=".35" transform="rotate(162 110 168)"/>
      <ellipse cx="32" cy="110" rx="4.5" ry="15" opacity=".35" transform="rotate(252 32 110)"/>
    </g>
  </g>

  <!-- ============ CENTER SPHERE ============ -->
  <circle cx="100" cy="100" r="15.5" fill="url(#sphereGrad)"/>
  <ellipse cx="95" cy="94" rx="4.5" ry="3" fill="#ffffff" opacity=".55" filter="url(#soften)"/>

</svg>