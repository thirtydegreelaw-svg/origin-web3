  <path d="M 256,182 C 256,220 256,280 256,332" fill="none" stroke="#6E0020" stroke-width="3" opacity="0.55"/>
  <path d="M 256,220 C 240,232 220,236 206,232" fill="none" stroke="#6E0020" stroke-width="2.5" opacity="0.5"/>
  <path d="M 256,260 C 274,270 296,272 310,266" fill="none" stroke="#6E0020" stroke-width="2.5" opacity="0.5"/>
  <path d="M 256,300 C 240,310 222,312 210,308" fill="none" stroke="#6E0020" stroke-width="2.5" opacity="0.5"/>

  <ellipse cx="222" cy="210" rx="12" ry="7" fill="#FFFFFF" opacity="0.55" transform="rotate(-30 222 210)"/>

  <circle cx="256" cy="256" r="60" fill="#FF2D55" opacity="0.22" filter="url(#coreGlow)"/>
