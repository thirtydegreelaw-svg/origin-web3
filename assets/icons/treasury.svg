<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Glow Filter for the entire icon -->
    <filter id="mainGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients for the 3D glossy effect -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffadb9" />
      <stop offset="30%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#b71c1c" />
    </linearGradient>

    <linearGradient id="bottomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d50000" />
      <stop offset="100%" stop-color="#4a0000" />
    </linearGradient>

    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5252" />
      <stop offset="50%" stop-color="#d50000" />
      <stop offset="100%" stop-color="#880000" />
    </linearGradient>

    <!-- Floor glow fade -->
    <linearGradient id="floorFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff1744" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- THE ICON ITSELF (Centered in the 200x200 box) -->
  <g transform="translate(100, 85)" filter="url(#mainGlow)">
    
    <!-- Bottom floor reflection glow -->
    <ellipse cx="0" cy="60" rx="50" ry="4" fill="url(#floorFade)" />
    <ellipse cx="0" cy="62" rx="25" ry="2" fill="#ffffff" opacity="0.5" />

    <!-- Dark base layers for depth -->
    <path d="M 0,-55 C 20,-55 40,-40 40,-20 C 40,0 20,-15 0,-15 C -20,-15 -40,0 -40,-20 C -40,-40 -20,-55 0,-55 Z" fill="#4a0000" transform="translate(0, 5)"/>
    <path d="M 0,55 C 20,55 40,40 40,20 C 40,0 20,15 0,15 C -20,15 -40,0 -40,20 C -40,40 -20,55 0,55 Z" fill="#4a0000" transform="translate(0, -5)"/>

    <!-- Top Fork Shape -->
    <path d="M 0,-50 C 20,-50 35,-35 35,-15 L 15,-15 C 15,-25 8,-32 0,-32 C -8,-32 -15,-25 -15,-15 L -35,-15 C -35,-35 -20,-50 0,-50 Z" fill="url(#topGrad)" />
    <!-- Top Highlight Edge -->
    <path d="M 0,-48 C 18,-48 33,-33 33,-17 L 17,-17 C 17,-26 9,-30 0,-30 C -9,-30 -17,-26 -17,-17 L -33,-17 C -33,-33 -18,-48 0,-48 Z" fill="none" stroke="#ffadb9" stroke-width="2" opacity="0.6" />

    <!-- Bottom Fork Shape -->
    <path d="M 0,50 C 20,50 35,35 35,15 L 15,15 C 15,25 8,32 0,32 C -8,32 -15,25 -15,15 L -35,15 C -35,35 -20,50 0,50 Z" fill="url(#bottomGrad)" />
    <!-- Bottom Highlight Edge -->
    <path d="M 0,48 C 18,48 33,33 33,17 L 17,17 C 17,26 9,30 0,30 C -9,30 -17,26 -17,17 L -33,17 C -33,33 -18,48 0,48 Z" fill="none" stroke="#ff5252" stroke-width="2" opacity="0.4" />

    <!-- Center Diamond Core -->
    <polygon points="0,-20 18,0 0,20 -18,0" fill="url(#centerGrad)" />
    <polygon points="0,-18 13,0 0,18 -13,0" fill="none" stroke="#ffadb9" stroke-width="2.5" opacity="0.7" />

    <!-- Center Sphere / Orb -->
    <circle cx="0" cy="0" r="11" fill="url(#centerGrad)" />
    <circle cx="0" cy="0" r="11" fill="none" stroke="#ff8a9b" stroke-width="2.5" />
    <!-- Glossy highlight on the sphere -->
    <ellipse cx="-4" cy="-4" rx="3.5" ry="2" fill="#ffffff" opacity="0.7" transform="rotate(-30, -4, -4)" />
  </g>
</svg>