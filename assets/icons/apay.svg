  <ellipse cx="256" cy="460" rx="150" ry="14" fill="url(#shadowGrad)" filter="url(#shadowBlur)"/>

  <rect x="106" y="166" width="300" height="196" rx="26" fill="url(#cardGrad)" stroke="#6E0020" stroke-width="2"/>
  <path d="M 128,188 L 260,188" fill="none" stroke="url(#edgeGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <rect x="106" y="222" width="300" height="34" fill="#6E0020" opacity="0.85"/>

  <rect x="132" y="284" width="58" height="42" rx="8" fill="url(#edgeGrad)" stroke="#6E0020" stroke-width="1.5"/>
  <line x1="132" y1="305" x2="190" y2="305" stroke="#6E0020" stroke-width="2" opacity="0.5"/>
  <line x1="161" y1="284" x2="161" y2="326" stroke="#6E0020" stroke-width="2" opacity="0.5"/>

