<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%"  stop-color="#ff5570"/>
      <stop offset="45%" stop-color="#e2003f"/>
      <stop offset="100%" stop-color="#7a0018"/>
    </radialGradient>

    <!-- white = visible, black = punched-out transparent hole shaped like "A" -->
    <mask id="cutA">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <text x="50" y="70" text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif" font-weight="800"
            font-size="52" fill="#000">A</text>
    </mask>
  </defs>

  <!-- reeded coin edge -->
  <g stroke="#e2003f" stroke-width="1.4" opacity=".55">
    <g id="ticks">
      <line x1="50" y1="2" x2="50" y2="7"/>
    </g>
  </g>
  <g stroke="#e2003f" stroke-width="1.4" opacity=".55">
    <use href="#ticks" transform="rotate(15 50 50)"/>
    <use href="#ticks" transform="rotate(30 50 50)"/>
    <use href="#ticks" transform="rotate(45 50 50)"/>
    <use href="#ticks" transform="rotate(60 50 50)"/>
    <use href="#ticks" transform="rotate(75 50 50)"/>
    <use href="#ticks" transform="rotate(90 50 50)"/>
    <use href="#ticks" transform="rotate(105 50 50)"/>
    <use href="#ticks" transform="rotate(120 50 50)"/>
    <use href="#ticks" transform="rotate(135 50 50)"/>
    <use href="#ticks" transform="rotate(150 50 50)"/>
    <use href="#ticks" transform="rotate(165 50 50)"/>
    <use href="#ticks" transform="rotate(180 50 50)"/>
    <use href="#ticks" transform="rotate(195 50 50)"/>
    <use href="#ticks" transform="rotate(210 50 50)"/>
    <use href="#ticks" transform="rotate(225 50 50)"/>
    <use href="#ticks" transform="rotate(240 50 50)"/>
    <use href="#ticks" transform="rotate(255 50 50)"/>
    <use href="#ticks" transform="rotate(270 50 50)"/>
    <use href="#ticks" transform="rotate(285 50 50)"/>
    <use href="#ticks" transform="rotate(300 50 50)"/>
    <use href="#ticks" transform="rotate(315 50 50)"/>
    <use href="#ticks" transform="rotate(330 50 50)"/>
    <use href="#ticks" transform="rotate(345 50 50)"/>
  </g>

  <!-- coin rim -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#7a0018" stroke-width="2.5"/>

  <!-- coin body with the A cut out of it -->
  <circle cx="50" cy="50" r="43" fill="url(#coinGrad)" mask="url(#cutA)"/>

  <!-- subtle top-left glossy highlight -->
  <ellipse cx="36" cy="30" rx="14" ry="8" fill="#ffffff" opacity=".18"/>
</svg>