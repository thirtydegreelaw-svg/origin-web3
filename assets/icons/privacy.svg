<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FF6E8F"/>
      <stop offset="45%" stop-color="#E01144"/>
      <stop offset="100%" stop-color="#8C002B"/>
    </linearGradient>

    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#FF8FA8"/>
    </linearGradient>

    <radialGradient id="coreGrad" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#FFB3C2"/>
      <stop offset="45%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#7B0018"/>
    </radialGradient>

    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D55" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF2D55" stop-opacity="0"/>
    </radialGradient>

    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="shadowBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <ellipse cx="256" cy="460" rx="150" ry="14" fill="url(#shadowGrad)" filter="url(#shadowBlur)"/>

  <path d="M 256,66
           C 210,96 160,112 116,116
           C 110,220 118,320 152,388
           C 182,448 224,478 256,494
           C 288,478 330,448 360,388
           C 394,320 402,220 396,116
           C 352,112 302,96 256,66 Z"
        fill="url(#shieldGrad)" stroke="#6E0020" stroke-width="2"/>

  <path d="M 256,90
           C 218,116 178,130 142,134
           C 138,222 145,306 172,364"
        fill="none" stroke="url(#edgeGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <path d="M 224,240
           C 224,214 238,198 256,198
           C 274,198 288,214 288,240
           L 288,258
           L 224,258 Z"
        fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <rect x="212" y="256" width="88" height="72" rx="14" fill="url(#coreGrad)" stroke="#6E0020" stroke-width="1.5"/>
  <circle cx="256" cy="284" r="10" fill="#FFFFFF" opacity="0.9"/>
  <rect x="251" y="292" width="10" height="20" rx="4" fill="#FFFFFF" opacity="0.9"/>

  <circle cx="256" cy="292" r="55" fill="#FF2D55" opacity="0.28" filter="url(#coreGlow)"/>
